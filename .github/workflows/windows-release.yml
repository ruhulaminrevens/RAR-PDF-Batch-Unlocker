name: Windows validation and installer
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Prepare visible desktop for real screenshots
        run: python scripts/prepare_desktop.py
      - name: Compile Python sources
        run: python -m compileall -q app.py ui.py qt_main.py qt_theme.py qt_widgets.py qt_pages.py qt_tools.py branding.py core.py reports.py diagnostics.py toolkit.py vault.py scripts tests
      - name: Build branded GUI with checksum-verified qpdf
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Automated tests including real qpdf and Tk
        shell: pwsh
        run: |
          $env:RAR_TEST_QPDF=(Resolve-Path 'bundled-qpdf/bin/qpdf.exe').Path
          # Emulate a default Windows install where long Win32 paths are not enabled.
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' LongPathsEnabled 0
          $env:QT_QPA_PLATFORM='offscreen'
          # Run the Qt tests and the Tk/engine tests in SEPARATE processes: mixing
          # both GUI toolkits in one interpreter can deadlock on Windows. Each run
          # has a watchdog so a hang reports the last test instead of burning the job.
          function Invoke-Tests($name, $modules, $outfile) {
            $targs = @('-u','-m','unittest') + $modules + @('-v')
            $p = Start-Process -FilePath python -ArgumentList $targs -RedirectStandardOutput $outfile -RedirectStandardError "$outfile.err" -NoNewWindow -PassThru
            if (-not $p.WaitForExit(600000)) {
              $p.Kill()
              $last = ((Get-Content $outfile -Tail 4) + (Get-Content "$outfile.err" -Tail 6)) -join ' || '
              Write-Host "::error title=$name timed out::$last"
              Get-Content $outfile -Tail 40 | Write-Host
              throw "$name timed out (watchdog)"
            }
            Get-Content "$outfile.err" -Tail 15 | Write-Host
            python scripts/annotate_failures.py $outfile
            return $p.ExitCode
          }
          $c1 = Invoke-Tests 'engine+Tk tests' @('tests.test_core','tests.test_toolkit','tests.test_branding','tests.test_vault','tests.test_gui') 'test-results.txt'
          $c2 = Invoke-Tests 'Qt GUI tests' @('tests.test_qt_gui') 'test-results-qt.txt'
          if ($c1 -ne 0) { exit $c1 }
          if ($c2 -ne 0) { exit $c2 }
      - name: Benchmark 100 and 1,000 synthetic PDFs
        shell: pwsh
        run: |
          $env:RAR_TEST_QPDF=(Resolve-Path 'bundled-qpdf/bin/qpdf.exe').Path
          python scripts/benchmark.py --counts 100,1000 --workers 1,4 --out qa/benchmark.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json;d=json.load(open('qa/benchmark.json'));print('::notice title=benchmark::'+json.dumps(d).replace('%','%25'))"
      - name: Real Qt GUI scenario and screenshots
        shell: pwsh
        run: |
          $env:PATH="$(Resolve-Path 'bundled-qpdf/bin');$env:PATH"
          $env:QT_QPA_PLATFORM='offscreen'
          python scripts/qt_capture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile branded installer
        shell: pwsh
        run: |
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup --version=6.6.1 --yes --no-progress }
          & $compiler 'installer/setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash=(Get-FileHash release/RAR-PDF-Batch-Unlocker-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RAR-PDF-Batch-Unlocker-Setup.exe" | Set-Content release/SHA256SUMS.txt
      - name: Install, exercise real installed GUI, verify icons and uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/validate_windows.ps1
      - name: Record validation commit
        if: success()
        shell: pwsh
        run: |
          "Validated commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID`nInstaller is unsigned." | Set-Content release/VALIDATION.txt
      - name: Upload validated installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RAR-PDF-Batch-Unlocker-validated-installer
          path: release/*
      - name: Upload real screenshots and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-QA-evidence
          path: |
            qa/screenshots/*
            qa/*.json
            qa/benchmark.json
            qa/*.log
            test-results.txt
            test-results-qt.txt
          if-no-files-found: warn
